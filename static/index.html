<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>行事曆 - 羽球教練紀錄工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/zh-tw.global.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <a href="/">行事曆</a>
    <a href="/students.html">學生管理</a>
    <a href="/packages.html">課程包</a>
    <a href="/venues.html">場地管理</a>
    <a href="/price_rules.html">價目表</a>
    <a href="/dashboard.html">收入統計</a>
    <a href="/unpaid.html">未收款清單</a>
    <a href="/booking.html">訂場檢查</a>
  </nav>
  <main>
    <div class="toolbar">
      <h1>行事曆</h1>
      <button id="btn-add-lesson">+ 新增課程</button>
    </div>
    <div id="calendar"></div>
  </main>

  <div class="modal-backdrop" id="lesson-modal">
    <div class="modal">
      <h2 id="modal-title">新增課程</h2>
      <form id="lesson-form">
        <div class="form-row">
          <label for="f-student">學生</label>
          <select id="f-student" required></select>
        </div>
        <div class="form-row">
          <label for="f-venue">場地</label>
          <select id="f-venue" required></select>
        </div>
        <div class="form-row">
          <label for="f-date">日期</label>
          <input id="f-date" type="date" required />
        </div>
        <div class="form-row">
          <label for="f-time">時間</label>
          <input id="f-time" type="time" required />
        </div>
        <div class="form-row">
          <label for="f-duration">時長（分鐘）</label>
          <input id="f-duration" type="number" min="1" value="60" required />
        </div>
        <div class="form-row">
          <label for="f-headcount">人數</label>
          <input id="f-headcount" type="number" min="1" value="1" required />
        </div>
        <p id="package-note" style="display: none; font-size: 13px; color: #888">
          此堂屬於課程包，金額與收款狀態由該包統一控管；狀態改為「請假」會自動順延一堂。
        </p>
        <div class="form-row">
          <label for="f-amount">金額（自動依價目表帶入，可覆寫）</label>
          <input id="f-amount" type="number" min="0" step="1" required />
        </div>
        <div class="form-row">
          <label for="f-payment">收款狀態</label>
          <select id="f-payment">
            <option value="unpaid">未收款</option>
            <option value="paid">已收款</option>
          </select>
        </div>
        <div class="form-row" id="row-status" style="display: none">
          <label for="f-status">課程狀態</label>
          <select id="f-status">
            <option value="scheduled">排定</option>
            <option value="completed">已完成</option>
            <option value="cancelled">取消</option>
            <option value="leave">請假</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="danger" id="btn-delete" style="display: none">刪除</button>
          <button type="button" class="secondary" id="btn-cancel">取消</button>
          <button type="submit">儲存</button>
        </div>
      </form>

      <div id="adjustments-section" style="display: none">
        <hr />
        <h3 style="font-size: 15px">額外費用</h3>
        <p id="cancellation-policy-hint" style="font-size: 12px; color: #888"></p>
        <table style="margin-bottom: 10px">
          <thead>
            <tr>
              <th>類型</th>
              <th>金額</th>
              <th>備註</th>
              <th>狀態</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="adjustment-list"></tbody>
        </table>
        <div class="form-row" style="flex-direction: row; gap: 8px; align-items: flex-end">
          <select id="adj-type" style="flex: 1">
            <option value="venue_fee">場地費</option>
            <option value="other">其他</option>
          </select>
          <input id="adj-amount" type="number" min="0" step="1" placeholder="金額" style="flex: 1" />
          <input id="adj-note" type="text" placeholder="備註" style="flex: 2" />
          <button type="button" id="btn-add-adjustment">新增</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/calendar.js"></script>
</body>
</html>
