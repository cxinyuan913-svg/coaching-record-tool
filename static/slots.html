<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找空檔 - 羽球教練紀錄工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="/">行事曆</a>
    <a href="/students.html">學生管理</a>
    <a href="/packages.html">課程套組</a>
    <a href="/venues.html">場地管理</a>
    <a href="/price_rules.html">價目表</a>
    <a href="/dashboard.html">收入統計</a>
    <a href="/unpaid.html">未收款清單</a>
    <a href="/booking.html">訂場檢查</a>
    <a href="/slots.html">找空檔</a>
  </nav>
  <main>
    <div class="toolbar">
      <h1>找空檔</h1>
    </div>

    <div class="section-block">
      <div class="panel">
        <div class="form-row">
          <label>日期</label>
          <div class="inline-row">
            <input id="f-date-from" type="date" />
            <span>到</span>
            <input id="f-date-to" type="date" />
          </div>
        </div>
        <div class="form-row">
          <label>時段（每天）</label>
          <div class="check-list" id="time-presets">
            <label><input type="radio" name="time-preset" value="08:00-22:30" checked />全天</label>
            <label><input type="radio" name="time-preset" value="08:00-12:00" />早上</label>
            <label><input type="radio" name="time-preset" value="12:00-18:00" />下午</label>
            <label><input type="radio" name="time-preset" value="18:00-22:30" />晚上</label>
            <label><input type="radio" name="time-preset" value="custom" />自訂</label>
          </div>
          <div class="inline-row" id="custom-time" hidden>
            <input id="f-time-from" type="time" value="18:00" step="1800" />
            <span>到</span>
            <input id="f-time-to" type="time" value="22:00" step="1800" />
          </div>
        </div>
        <div class="form-row">
          <label>場館</label>
          <div class="inline-row" id="area-buttons"></div>
          <div id="venue-checks" class="check-list"></div>
        </div>
        <div class="form-row">
          <label for="f-duration">課程時長</label>
          <select id="f-duration"></select>
        </div>
        <div class="panel-actions">
          <button id="btn-search">找空檔</button>
          <span id="search-status" class="hint"></span>
        </div>
      </div>
    </div>

    <div class="section-block" id="result-block" hidden>
      <h2>結果</h2>
      <table>
        <thead>
          <tr><th>日期</th><th>時段</th><th>場館</th><th>說明（只有你看得到）</th></tr>
        </thead>
        <tbody id="candidate-list"></tbody>
      </table>
      <h2 style="margin-top: 20px">給學生的訊息</h2>
      <textarea id="msg-output" class="panel-textarea" rows="8"></textarea>
      <div class="panel-actions">
        <button id="btn-copy">複製</button>
        <span id="copy-status" class="hint"></span>
      </div>
    </div>

    <div class="section-block">
      <details id="travel-details">
        <summary><strong>場館車程表</strong> <span class="hint">（沒填的組合不會排跨館候選）</span></summary>
        <table>
          <thead>
            <tr><th>場館 A</th><th>場館 B</th><th>車程（分鐘）</th></tr>
          </thead>
          <tbody id="travel-list"></tbody>
        </table>
        <div class="panel-actions">
          <button id="btn-save-travel">儲存車程表</button>
          <span id="travel-status" class="hint"></span>
        </div>
      </details>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/slots.js"></script>
</body>
</html>
