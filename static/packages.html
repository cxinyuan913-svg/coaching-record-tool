<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>課程套組 - 羽球教練紀錄工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="/">行事曆</a>
    <a href="/students.html">學生管理</a>
    <a href="/packages.html">課程套組</a>
    <a href="/venues.html">場地管理</a>
    <a href="/price_rules.html">價目表</a>
    <a href="/dashboard.html">收入統計</a>
    <a href="/unpaid.html">未收款清單</a>
    <a href="/booking.html">訂場檢查</a>
  </nav>
  <main>
    <div class="toolbar">
      <h1>課程套組</h1>
      <button id="btn-add">新增套組</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>學生</th>
          <th>名稱</th>
          <th>時長</th>
          <th>剩餘/總堂數</th>
          <th>單堂攤提</th>
          <th>狀態</th>
          <th>收款</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="package-list"></tbody>
    </table>
  </main>

  <div class="modal-backdrop" id="package-modal">
    <div class="modal">
      <h2 id="modal-title">新增套組（批次排課）</h2>
      <form id="package-form">
        <div class="form-row">
          <label for="f-student">學生</label>
          <select id="f-student" required></select>
        </div>
        <div class="form-row">
          <label for="f-name">套組名稱</label>
          <input id="f-name" type="text" required />
        </div>
        <div class="form-row">
          <label for="f-duration">標準單堂時長</label>
          <select id="f-duration" required></select>
        </div>
        <div class="form-row">
          <label for="f-total-sessions">總堂數</label>
          <input id="f-total-sessions" type="number" min="1" step="1" value="8" required />
        </div>
        <div class="form-row">
          <label for="f-coach-fee">堂課費（每小時，收入）</label>
          <input id="f-coach-fee" type="number" min="0" step="1" required />
        </div>
        <div class="form-row">
          <label for="f-venue-fee">場地費（每小時，代收代付）</label>
          <input id="f-venue-fee" type="number" min="0" step="1" value="0" required />
        </div>
        <p style="font-size: 13px; color: #555; margin: 0 0 12px">
          預估總金額（<span id="total-sessions-display">8</span> 堂 × <span id="per-session-display">0</span>）：
          <strong id="total-price-display">0</strong>
        </p>
        <div class="form-row">
          <label for="f-purchased-date">購買日期</label>
          <input id="f-purchased-date" type="date" required />
        </div>
        <div class="form-row">
          <label for="f-start-date">第一堂日期</label>
          <input id="f-start-date" type="date" required />
          <span id="weekday-hint" style="font-size: 12px; color: #888"></span>
        </div>
        <div class="form-row">
          <label for="f-recur-time-hour">上課時段（24 小時制）</label>
          <div style="display: flex; gap: 6px; align-items: center">
            <select id="f-recur-time-hour" required></select>
            <span>:</span>
            <select id="f-recur-time-minute" required></select>
          </div>
        </div>
        <div class="form-row">
          <label for="f-venue">預設場地</label>
          <select id="f-venue" required></select>
        </div>
        <div class="form-row" id="row-payment">
          <label for="f-payment">收款狀態</label>
          <select id="f-payment">
            <option value="unpaid">未收款</option>
            <option value="paid">已收款</option>
          </select>
        </div>
        <p id="edit-note" style="display: none; font-size: 13px; color: #888">
          編輯不會自動增減課程堂數；已排好的課程請到行事曆個別改期或刪除。改費率會重新計算底下所有堂（依各堂自己的時長）的金額，
          某堂時長不同只影響那一堂，不影響其他堂。收款狀態請用列表上的按鈕切換。
        </p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="btn-cancel">取消</button>
          <button type="submit" id="btn-save">儲存並批次排課</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="settlement-modal">
    <div class="modal">
      <h2>套組結算單</h2>
      <table style="margin-bottom: 10px">
        <thead>
          <tr>
            <th>類型</th>
            <th>金額</th>
            <th>備註</th>
          </tr>
        </thead>
        <tbody id="settlement-list"></tbody>
      </table>
      <p><strong>未結清合計：<span id="settlement-total">0</span></strong></p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="btn-settlement-close">關閉</button>
        <button type="button" id="btn-settle-all">全部標記結清</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/packages.js"></script>
</body>
</html>
