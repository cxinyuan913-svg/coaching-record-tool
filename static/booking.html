<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>訂場檢查 - 羽球教練紀錄工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="/">行事曆</a>
    <a href="/students.html">學生管理</a>
    <a href="/packages.html">課程包</a>
    <a href="/venues.html">場地管理</a>
    <a href="/price_rules.html">價目表</a>
    <a href="/dashboard.html">收入統計</a>
    <a href="/unpaid.html">未收款清單</a>
    <a href="/booking.html">訂場檢查</a>
  </nav>
  <main>
    <h1>訂場檢查</h1>

    <div class="section-block">
      <h2>可訂未訂（請盡快訂場）</h2>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>學生</th>
            <th>場地</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="need-booking"></tbody>
      </table>
    </div>

    <div class="section-block">
      <details>
        <summary><h2 style="display:inline">尚未開放（點擊展開）</h2></summary>
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>學生</th>
              <th>場地</th>
              <th>開放時間</th>
            </tr>
          </thead>
          <tbody id="not-yet-open"></tbody>
        </table>
      </details>
    </div>

    <div class="section-block">
      <h2>已訂</h2>
      <table class="dimmed-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>學生</th>
            <th>場地</th>
            <th>訂場時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="already-booked"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/booking.js"></script>
</body>
</html>
