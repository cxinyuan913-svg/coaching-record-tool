<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>場地管理 - 羽球教練紀錄工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
</head>
<body>
  <nav class="topnav">
    <a href="/">行事曆</a>
    <a href="/students.html">學生管理</a>
    <a href="/packages.html">課程套組</a>
    <a href="/venues.html">場地管理</a>
    <a href="/price_rules.html">價目表</a>
    <a href="/dashboard.html">收入統計</a>
    <a href="/unpaid.html">未收款清單</a>
    <a href="/booking.html">訂場檢查</a>
    <a href="/slots.html">找空檔</a>
  </nav>
  <main>
    <div class="toolbar">
      <h1>場地管理</h1>
      <button id="btn-add">新增場地</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>名稱</th>
          <th>地址</th>
          <th>開放訂場規則</th>
          <th>取消／改期規定</th>
          <th>場地費</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="venue-list"></tbody>
    </table>
  </main>

  <div class="modal-backdrop" id="venue-modal">
    <div class="modal">
      <h2 id="modal-title">新增場地</h2>
      <form id="venue-form">
        <div class="form-row">
          <label for="f-name">名稱</label>
          <input id="f-name" type="text" required />
        </div>
        <div class="form-row">
          <label for="f-address">地址</label>
          <input id="f-address" type="text" />
        </div>
        <div class="form-row" style="flex-direction: row; align-items: center; gap: 6px">
          <input id="f-anytime" type="checkbox" style="width: auto" />
          <label for="f-anytime" style="margin: 0">隨時可訂（無開放時間限制）</label>
        </div>
        <div class="form-row" id="row-days">
          <label for="f-days">提前幾天開放預訂</label>
          <input id="f-days" type="number" min="0" value="0" />
        </div>
        <div class="form-row" id="row-time">
          <label for="f-time">開放時刻</label>
          <input id="f-time" type="time" value="00:00" />
        </div>
        <div class="form-row">
          <label for="f-policy">取消／改期規定</label>
          <textarea id="f-policy" rows="2"></textarea>
        </div>
        <div class="form-row">
          <label for="f-note">備註</label>
          <textarea id="f-note" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="btn-cancel">取消</button>
          <button type="submit">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 場地費價目表：公開預約網站依場館、星期、時段計算場地費用 -->
  <div class="modal-backdrop" id="fee-modal">
    <div class="modal" style="max-width: 720px; width: 95vw">
      <h2 id="fee-modal-title">場地費價目表</h2>
      <p style="color: #666; font-size: 13px; margin-top: 0">
        每小時場地費，依星期與時段設定。一堂課跨兩個時段時按分鐘比例計算；
        沒設定到的時段，公開預約網站就無法報價。同一個星期的時段不能重疊。
      </p>
      <table>
        <thead>
          <tr><th>適用星期</th><th>開始</th><th>結束</th><th>每小時</th><th></th></tr>
        </thead>
        <tbody id="fee-rows"></tbody>
      </table>
      <div style="margin-top: 8px">
        <button type="button" class="secondary" id="btn-fee-add">新增一列</button>
      </div>
      <p id="fee-error" style="color: #c0392b; font-size: 13px; display: none"></p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="btn-fee-cancel">取消</button>
        <button type="button" id="btn-fee-save">儲存</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/venues.js"></script>
</body>
</html>
