<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>學生管理 - 羽球教練紀錄工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="/">行事曆</a>
    <a href="/students.html">學生管理</a>
    <a href="/packages.html">課程套組</a>
    <a href="/venues.html">場地管理</a>
    <a href="/price_rules.html">價目表</a>
    <a href="/dashboard.html">收入統計</a>
    <a href="/unpaid.html">未收款清單</a>
    <a href="/booking.html">訂場檢查</a>
  </nav>
  <main>
    <div class="toolbar">
      <h1>學生管理</h1>
      <button id="btn-add">新增學生</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>聯絡方式</th>
          <th>等級</th>
          <th>進行中課程套組（剩餘/總堂數）</th>
          <th>備註</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="student-list"></tbody>
    </table>
  </main>

  <div class="modal-backdrop" id="student-modal">
    <div class="modal">
      <h2 id="modal-title">新增學生</h2>
      <form id="student-form">
        <div class="form-row">
          <label for="f-name">姓名</label>
          <input id="f-name" type="text" required />
        </div>
        <div class="form-row">
          <label for="f-contact">聯絡方式</label>
          <input id="f-contact" type="text" />
        </div>
        <div class="form-row">
          <label for="f-tier">等級</label>
          <select id="f-tier">
            <option value="new">新生</option>
            <option value="friend">朋友</option>
            <option value="regular">熟客</option>
          </select>
        </div>
        <div class="form-row">
          <label for="f-note">備註</label>
          <textarea id="f-note" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="btn-cancel">取消</button>
          <button type="submit">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/students.js"></script>
</body>
</html>
